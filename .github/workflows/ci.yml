name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: 1.25.4
      - run: bun install --frozen-lockfile
      - name: Install release scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          curl --fail --location \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz \
            --output /tmp/trufflehog.tar.gz
          echo "7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  /tmp/trufflehog.tar.gz" \
            | sha256sum --check -
          tar --extract --gzip --file /tmp/trufflehog.tar.gz --directory "$HOME/go/bin" trufflehog
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: bun run verify
      - run: bun run qa:release
        env:
          MYNAS_RELEASE_AUDIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
