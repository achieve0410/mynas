name: Release macOS bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          cache: false
          go-version: 1.25.4
      - run: bun install --frozen-lockfile
      - name: Install pinned release scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          go install github.com/trufflesecurity/trufflehog/v3@v3.96.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(bun -e 'const value = await Bun.file("package.json").json(); process.stdout.write(value.version)')
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - run: bun run verify
      - run: bun run test:browser
      - run: bun run qa:release
      - run: bun run package:macos
      - run: bun run qa:macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: mynas-darwin-arm64
          path: |
            dist/mynas-darwin-arm64.tar.gz
            dist/mynas-darwin-arm64.tar.gz.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mynas-darwin-arm64
          path: dist
      - name: Create immutable tagged GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mynas-darwin-arm64.tar.gz \
            dist/mynas-darwin-arm64.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
