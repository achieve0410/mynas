name: Release macOS bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          cache: false
          go-version: 1.25.4
      - run: bun install --frozen-lockfile
      - name: Install pinned Docker Compose tooling
        run: |
          TOOL_ROOT="$RUNNER_TEMP/mynas-release-tools"
          mkdir -p "$TOOL_ROOT/bin" "$TOOL_ROOT/docker-config/cli-plugins"
          curl --fail --location \
            https://download.docker.com/mac/static/stable/aarch64/docker-29.5.2.tgz \
            --output "$TOOL_ROOT/docker.tgz"
          echo "e4914a334e71297dd1b172f0332d5045539e12d00429ddc330da9d2ad0e3995a  $TOOL_ROOT/docker.tgz" \
            | shasum --algorithm 256 --check
          tar --extract --gzip --file "$TOOL_ROOT/docker.tgz" \
            --directory "$TOOL_ROOT/bin" --strip-components 1 docker/docker
          curl --fail --location \
            https://github.com/docker/compose/releases/download/v2.39.2/docker-compose-darwin-aarch64 \
            --output "$TOOL_ROOT/docker-config/cli-plugins/docker-compose"
          echo "44ea135a29b176d959aed927d61d3483b3f0e7b4a2025ab7812aa00086916f13  $TOOL_ROOT/docker-config/cli-plugins/docker-compose" \
            | shasum --algorithm 256 --check
          chmod +x "$TOOL_ROOT/docker-config/cli-plugins/docker-compose"
          echo "$TOOL_ROOT/bin" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$TOOL_ROOT/docker-config" >> "$GITHUB_ENV"
      - name: Install pinned release scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          curl --fail --location \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_darwin_arm64.tar.gz \
            --output /tmp/trufflehog.tar.gz
          echo "87478306b95ca2420cfb844b7582383ac60b922e262350a0088e797f328d2e62  /tmp/trufflehog.tar.gz" \
            | shasum --algorithm 256 --check
          tar --extract --gzip --file /tmp/trufflehog.tar.gz --directory "$(go env GOPATH)/bin" trufflehog
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PACKAGE_VERSION=$(bun -e 'const value = await Bun.file("package.json").json(); process.stdout.write(value.version)')
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - run: bun run verify
      - run: bun run test:browser
      - run: bun run qa:release
      - run: bun run package:macos
      - run: bun run qa:macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: mynas-darwin-arm64
          path: |
            dist/mynas-darwin-arm64.tar.gz
            dist/mynas-darwin-arm64.tar.gz.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: mynas-darwin-arm64
          path: dist
      - name: Create immutable tagged GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mynas-darwin-arm64.tar.gz \
            dist/mynas-darwin-arm64.tar.gz.sha256 \
            --generate-notes \
            --verify-tag
