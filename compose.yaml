name: mynas

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: mynas-minio-qa
    profiles:
      - qa
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MYNAS_QA_S3_ACCESS_KEY:?set MYNAS_QA_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MYNAS_QA_S3_SECRET_KEY:?set MYNAS_QA_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
